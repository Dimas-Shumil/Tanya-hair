<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Заявки | ShumDev Custom CMS</title>
    <link rel="stylesheet" href="/site/css/admin.min.css" />
    <script src="/site/js/admin/common.js" defer></script>
    <script src="/site/js/admin/requests.js" defer></script>
  </head>

  <body class="admin-body" data-admin-page="requests">
    <div class="admin-shell">
      <aside class="admin-sidebar">
        <a class="admin-sidebar__brand" href="/admin/works">
          <span>ShumDev Custom CMS</span>
          <strong>СТИЛЬ</strong>
        </a>

        <nav class="admin-sidebar__nav" aria-label="Админ-панель">
          <a href="/admin/works" data-admin-nav="works">Портфолио</a>
          <a href="/admin/requests" data-admin-nav="requests">Заявки</a>
        </nav>

        <div class="admin-sidebar__actions">
          <button
            type="button"
            class="admin-sidebar__site-button"
            data-admin-return-site
          >
            ← Вернуться на сайт
          </button>

          <button type="button" class="admin-sidebar__logout" data-admin-logout>
            Выйти
          </button>
        </div>
      </aside>

      <main class="admin-main">
        <header class="admin-topbar">
          <div>
            <p class="admin-eyebrow">Обращения</p>
            <h1>Заявки</h1>
          </div>
        </header>

        <section class="admin-panel">
          <div class="admin-panel__head admin-panel__head--filters">
            <div>
              <h2>Список заявок</h2>
              <p id="requestsCount">Загрузка...</p>
            </div>

            <div
              class="admin-filters"
              role="group"
              aria-label="Фильтр заявок"
            >
              <button type="button" class="is-active" data-status-filter="">
                Все
              </button>
              <button type="button" data-status-filter="new">Новые</button>
              <button type="button" data-status-filter="in_progress">
                В работе
              </button>
              <button type="button" data-status-filter="completed">
                Завершённые
              </button>
            </div>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table admin-table--requests">
              <thead>
                <tr>
                  <th scope="col">Клиент</th>
                  <th scope="col">Услуга</th>
                  <th scope="col">Страница</th>
                  <th scope="col">Статус</th>
                  <th scope="col">Дата</th>
                  <th scope="col" aria-label="Действия"></th>
                </tr>
              </thead>
              <tbody id="requestsTableBody">
                <tr>
                  <td colspan="6">Загружаем заявки...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <p class="admin-empty" id="requestsEmpty" hidden>
            Заявок с таким статусом пока нет.
          </p>
        </section>
      </main>
    </div>
  </body>
</html>
