<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>Портфолио | ShumDev Custom CMS</title>
    <link rel="stylesheet" href="/site/css/admin.min.css?v=20261013-1" />
    <script src="/site/js/admin/common.js?v=20261013-1" defer></script>
    <script src="/site/js/admin/works.js?v=20261013-1" defer></script>
  </head>

  <body class="admin-body" data-admin-page="works">
    <div class="admin-shell">
      <main class="admin-main">
        <header class="admin-topbar">
          <div>
            <p class="admin-eyebrow">Каталог</p>
            <h1>Портфолио</h1>
          </div>

          <a class="admin-button" href="/admin/work-edit">Добавить работу</a>
        </header>

        <section class="admin-panel">
          <div class="admin-panel__head">
            <div>
              <h2>Работы</h2>
              <p id="worksCount">Загрузка...</p>
            </div>

            <a
              class="admin-link"
              href="/portfolio"
              target="_blank"
              rel="noopener noreferrer"
            >
              Открыть на сайте
            </a>
          </div>

          <div class="admin-table-wrap">
            <table class="admin-table">
              <thead>
                <tr>
                  <th scope="col">Работа</th>
                  <th scope="col">Slug</th>
                  <th scope="col">Фото</th>
                  <th scope="col">Статус</th>
                  <th scope="col">Порядок</th>
                  <th scope="col" aria-label="Действия"></th>
                </tr>
              </thead>
              <tbody id="worksTableBody">
                <tr>
                  <td colspan="6">Загружаем работы...</td>
                </tr>
              </tbody>
            </table>
          </div>

          <p class="admin-empty" id="worksEmpty" hidden>
            Работ пока нет. Добавьте первую работу в портфолио.
          </p>
        </section>
      </main>
      <nav class="admin-bottom-nav" aria-label="Навигация админ-панели">
        <a href="/admin/works" data-admin-nav="works" class="admin-bottom-nav__link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
          <span>Работы</span>
        </a>
        <a href="/admin/requests" data-admin-nav="requests" class="admin-bottom-nav__link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16v16H4z"/><path d="M8 9h8M8 13h8M8 17h5"/></svg>
          <span>Заявки</span>
        </a>
        <a href="/" target="_blank" rel="noopener noreferrer" class="admin-bottom-nav__link">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3.5 12h17M12 3c-5 5-5 13 0 18M12 3c5 5 5 13 0 18"/></svg>
          <span>Смотреть на сайте</span>
        </a>
        <button type="button" data-admin-logout class="admin-bottom-nav__link admin-bottom-nav__logout">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 4H5v16h5M14 8l4 4-4 4M8 12h10"/></svg>
          <span>Выход</span>
        </button>
      </nav>
    </div>
  </body>
</html>
